# Builds the Windows client and the Android app. On a version tag (v0.1.0) it also drafts a
# GitHub release with both; publish the draft by hand. Run it by hand to only get the builds.
#
# The APK is signed with the release key from these repository secrets:
#   ANDROID_KEYSTORE_BASE64  the .jks file, base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them a manual run signs with a throwaway debug key, and a tag run fails.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # The version from the tag, or from Cargo.toml for a manual run.
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  # Publishing a draft whose tag has gone creates the tag again, which would rebuild for
  # nothing and then fail to draft a release that exists: skip everything then.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TAG" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $TAG exists already: nothing to build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      # Dependencies compiled by earlier runs: most of the build time.
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Third-party licences
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.txt

      - name: Package
        env:
          # DeepFilterNet 3's low-latency model, from its v0.5.6 release (src/denoise.rs).
          MODEL_URL: https://github.com/Rikorose/DeepFilterNet/raw/v0.5.6/models/DeepFilterNet3_ll_onnx.tar.gz
          MODEL_SHA256: 5998e58e8ba0e09bb76986ef97b84afa065a571ef282d4a1222f341e3251cf3a
          LICENSE_URL: https://github.com/Rikorose/DeepFilterNet/raw/v0.5.6/LICENSE-MIT
        run: |
          curl -fsSL -o platform-tools.zip \
            https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip -q platform-tools.zip
          curl -fsSL -o DeepFilterNet3_ll_onnx.tar.gz "$MODEL_URL"
          echo "$MODEL_SHA256  DeepFilterNet3_ll_onnx.tar.gz" | sha256sum -c -
          curl -fsSL -o DeepFilterNet-LICENSE.txt "$LICENSE_URL"
          # The window and the command line apart: most people only want the window.
          for kind in gui cli; do
            if [ $kind = gui ]; then
              dir="galdr-$VERSION-windows-x64"; exe=galdr-gui.exe
            else
              dir="galdr-cli-$VERSION-windows-x64"; exe=galdr.exe
            fi
            mkdir "$dir"
            cp "target/release/$exe" README.md LICENSE THIRD-PARTY-LICENSES.txt "$dir/"
            # adb for phones on a USB cable (see the README), with its licence notice.
            cp platform-tools/adb.exe platform-tools/AdbWinApi.dll platform-tools/AdbWinUsbApi.dll "$dir/"
            cp platform-tools/NOTICE.txt "$dir/adb-NOTICE.txt"
            # The noise suppression model, with its licence.
            cp DeepFilterNet3_ll_onnx.tar.gz DeepFilterNet-LICENSE.txt "$dir/"
            7z a -tzip "$dir.zip" "$dir" > /dev/null
          done

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: galdr*-windows-x64.zip

  android:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true # libopus

      - name: Version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: SDK, NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [ -n "$TAG" ]; then
              echo "::error::No release key in the repository secrets (see the top of this file)"
              exit 1
            fi
            echo "::warning::No release key: the APK is signed with a debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "GALDR_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "GALDR_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "GALDR_KEY_ALIAS=$KEY_ALIAS"
            echo "GALDR_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "galdr-$VERSION.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: galdr-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "galdr ${TAG#v}"
