# Builds the Windows client and the Android app. On a version tag (v0.1.0) it also drafts a
# GitHub release with both; publish the draft by hand. Run it by hand to only get the builds.
#
# The APK is signed with the release key from these repository secrets:
#   ANDROID_KEYSTORE_BASE64  the .jks file, base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them a manual run signs with a throwaway debug key, and a tag run fails.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # The version from the tag, or from Cargo.toml for a manual run.
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package with adb
        run: |
          curl -fsSL -o platform-tools.zip \
            https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip -q platform-tools.zip
          dir="galdr-$VERSION-windows-x64"
          mkdir "$dir"
          cp target/release/galdr-gui.exe target/release/galdr.exe README.md LICENSE "$dir/"
          # adb for phones on a USB cable (see the README), with its licence notice.
          cp platform-tools/adb.exe platform-tools/AdbWinApi.dll platform-tools/AdbWinUsbApi.dll "$dir/"
          cp platform-tools/NOTICE.txt "$dir/adb-NOTICE.txt"
          7z a -tzip "$dir.zip" "$dir" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: galdr-*-windows-x64.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # libopus

      - name: Version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: SDK, NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [ -n "$TAG" ]; then
              echo "::error::No release key in the repository secrets (see the top of this file)"
              exit 1
            fi
            echo "::warning::No release key: the APK is signed with a debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "GALDR_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "GALDR_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "GALDR_KEY_ALIAS=$KEY_ALIAS"
            echo "GALDR_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "galdr-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: galdr-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "galdr ${TAG#v}"
